<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Large format photography by Brad Korman. Selected works shot on 4×5 film.">
  <title>Brad Korman — Photo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    main {
      padding: 64px 0 80px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 52px;
    }

    .page-context {
      font-size: 11px;
      color: var(--ink-faint);
      font-style: italic;
      text-align: right;
      line-height: 1.6;
    }

    /* Photo grid — 4 columns with two wide items for rhythm */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      margin-bottom: 48px;
    }

    .photo-item {
      position: relative;
      overflow: hidden;
      background: #d8d0c0;
      cursor: pointer;
    }

    /* Wide items span 2 columns */
    .photo-item.wide {
      grid-column: span 2;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      aspect-ratio: 1;
      /* Subtle sepia to match paper aesthetic */
      filter: sepia(0.08) contrast(1.02);
      transition: transform 0.4s ease, filter 0.3s ease;
    }

    .photo-item.wide img {
      aspect-ratio: 2;
    }

    .photo-item:hover img {
      transform: scale(1.03);
      filter: sepia(0) contrast(1.05);
    }

    /* Title overlay — appears on hover */
    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px 14px 12px;
      background: linear-gradient(transparent, rgba(20,16,10,0.55));
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.85);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .photo-item:hover .photo-caption {
      opacity: 1;
    }

    .archive-note {
      border-top: 1px solid var(--rule);
      padding-top: 28px;
    }

    .archive-text {
      font-size: 12px;
      color: var(--ink-faint);
      font-style: italic;
    }

    /* =====================
       LIGHTBOX
       ===================== */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,14,12,0.94);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-inner {
      position: relative;
      max-width: 85vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      cursor: default;
    }

    .lightbox-inner img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      display: block;
      filter: sepia(0.05) contrast(1.03);
    }

    .lightbox-title {
      font-family: 'Special Elite', cursive;
      font-size: 18px;
      color: #e8e4dc;
      letter-spacing: 0.08em;
    }

    .lightbox-close {
      position: fixed;
      top: 24px;
      right: 32px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b6458;
      cursor: pointer;
      transition: color 0.15s;
      z-index: 10000;
    }

    .lightbox-close:hover { color: #e8e4dc; }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      color: #6b6458;
      cursor: pointer;
      padding: 12px;
      transition: color 0.15s;
      user-select: none;
      z-index: 10000;
    }

    .lightbox-nav:hover { color: #e8e4dc; }
    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="index.html" class="site-id">Brad Korman</a>
      <nav class="top-nav" aria-label="Site navigation">
        <a href="about.html">About</a>
        <a href="animation.html">Animation</a>
        <a href="music.html">Music</a>
        <a href="photo.html" class="active">Photo</a>
        <a href="video.html">Video</a>
      </nav>
    </header>

    <main class="fadein">
      <span class="page-label">04 — Photo</span>
      <div class="page-header">
        <h1 class="page-title">Large Format<br>Photography</h1>
        <p class="page-context">4×5 film<br>Selected works</p>
      </div>

      <!-- Photo grid
           Images are served from your existing bradkorman.co/images/portfolio/art/ folder.
           To add new photos: copy a .photo-item block, update src and alt/title.
           To make an image wide: add class="photo-item wide" (spans 2 columns).
           Keep the data-index values sequential (0, 1, 2...) for lightbox to work. -->
      <div class="photo-grid" id="photoGrid">
        <div class="photo-item wide" data-index="0">
          <img src="https://bradkorman.co/images/portfolio/art/wine_print.jpg" alt="Sacrifice" loading="lazy">
          <span class="photo-caption">Sacrifice</span>
        </div>
        <div class="photo-item" data-index="1">
          <img src="https://bradkorman.co/images/portfolio/art/skull_print.jpg" alt="Breath" loading="lazy">
          <span class="photo-caption">Breath</span>
        </div>
        <div class="photo-item" data-index="2">
          <img src="https://bradkorman.co/images/respite_print.jpg" alt="Respite" loading="lazy">
          <span class="photo-caption">Respite</span>
        </div>
        <div class="photo-item" data-index="3">
          <img src="https://bradkorman.co/images/sight_print.jpg" alt="Sight" loading="lazy">
          <span class="photo-caption">Sight</span>
        </div>
        <div class="photo-item" data-index="4">
          <img src="https://bradkorman.co/images/stress_print.jpg" alt="Stress" loading="lazy">
          <span class="photo-caption">Stress</span>
        </div>
        <div class="photo-item wide" data-index="5">
          <img src="https://bradkorman.co/images/web_print.jpg" alt="Web" loading="lazy">
          <span class="photo-caption">Web</span>
        </div>
        <div class="photo-item" data-index="6">
          <img src="https://bradkorman.co/images/appetite_print.jpg" alt="Appetite" loading="lazy">
          <span class="photo-caption">Appetite</span>
        </div>
        <div class="photo-item" data-index="7">
          <img src="https://bradkorman.co/images/loss_print.jpg" alt="Loss" loading="lazy">
          <span class="photo-caption">Loss</span>
        </div>
      </div>

      <div class="archive-note">
        <p class="archive-text">Shot on 4×5 large format film.</p>
      </div>
    </main>

    <footer>
      <span class="footer-left">© 2026 Brad Korman</span>
      <div class="footer-links">
        <a href="https://vimeo.com/remarquecreative" target="_blank">Vimeo</a>
        <a href="https://www.linkedin.com/in/brad-korman/" target="_blank">LinkedIn</a>
        <a href="https://github.com/MadNeat-O" target="_blank">GitHub</a>
      </div>
    </footer>
  </div>

  <!-- Lightbox — click any photo to open, arrow keys to navigate, Escape to close -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer">
    <span class="lightbox-close" id="lbClose" role="button" tabindex="0">Close ✕</span>
    <span class="lightbox-nav lightbox-prev" id="lbPrev" role="button" tabindex="0" aria-label="Previous photo">←</span>
    <div class="lightbox-inner">
      <img src="" alt="" id="lbImg">
      <span class="lightbox-title" id="lbTitle"></span>
    </div>
    <span class="lightbox-nav lightbox-next" id="lbNext" role="button" tabindex="0" aria-label="Next photo">→</span>
  </div>

  <script>
    // Photo data — keep this in sync with the grid above
    const photos = [
      { src: 'https://bradkorman.co/images/portfolio/art/wine_print.jpg',    title: 'Sacrifice' },
      { src: 'https://bradkorman.co/images/portfolio/art/skull_print.jpg',   title: 'Breath'    },
      { src: 'https://bradkorman.co/images/portfolio/art/respite_print.jpg', title: 'Respite'   },
      { src: 'https://bradkorman.co/images/portfolio/art/sight_print.jpg',   title: 'Sight'     },
      { src: 'https://bradkorman.co/images/portfolio/art/stress_print.jpg',  title: 'Stress'    },
      { src: 'https://bradkorman.co/images/portfolio/art/web_print.jpg',     title: 'Web'       },
      { src: 'https://bradkorman.co/images/portfolio/art/appetite_print.jpg',title: 'Appetite'  },
      { src: 'https://bradkorman.co/images/portfolio/art/loss_print.jpg',    title: 'Loss'      },
    ];

    let current = 0;
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lbImg');
    const lbTitle = document.getElementById('lbTitle');

    function openLightbox(index) {
      current = index;
      lbImg.src = photos[current].src;
      lbImg.alt = photos[current].title;
      lbTitle.textContent = photos[current].title;
      lb.classList.add('open');
    }

    function closeLightbox() { lb.classList.remove('open'); }

    function showNext() {
      current = (current + 1) % photos.length;
      lbImg.src = photos[current].src;
      lbTitle.textContent = photos[current].title;
    }

    function showPrev() {
      current = (current - 1 + photos.length) % photos.length;
      lbImg.src = photos[current].src;
      lbTitle.textContent = photos[current].title;
    }

    // Open on grid click
    document.querySelectorAll('.photo-item').forEach(item => {
      item.addEventListener('click', () => openLightbox(parseInt(item.dataset.index)));
    });

    // Close / navigate controls
    document.getElementById('lbClose').addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });
    document.getElementById('lbPrev').addEventListener('click',  e => { e.stopPropagation(); showPrev(); });
    document.getElementById('lbNext').addEventListener('click',  e => { e.stopPropagation(); showNext(); });

    // Click backdrop to close
    lb.addEventListener('click', closeLightbox);

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft')  showPrev();
      if (e.key === 'Escape')     closeLightbox();
    });
  </script>
</body>
</html>
